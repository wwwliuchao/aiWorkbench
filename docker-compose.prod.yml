services:
  asset-portal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    image: asset-portal:latest
    container_name: asset-portal
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3001:3001"
